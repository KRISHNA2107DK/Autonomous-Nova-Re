# PostgreSQL 16 — one instance hosting productsdb, ordersdb and paymentsdb.
# The password lives in Secret shopfusion/shopfusion-db, generated randomly by
# `python -m novasurge up` on first deploy (it is never committed to git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shopfusion
data:
  01-databases.sql: |
    CREATE DATABASE ordersdb;
    CREATE DATABASE paymentsdb;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopfusion
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=250", "-c", "shared_buffers=64MB"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: novasurge
            - name: POSTGRES_DB
              value: productsdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopfusion-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "novasurge", "-d", "productsdb"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "novasurge", "-d", "productsdb"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: shopfusion
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
