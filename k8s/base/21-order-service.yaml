# order-service — order saga: product lookup -> stock reservation -> payment -> event.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopfusion
  labels:
    app: order-service
    tier: backend
  annotations:
    novasurge.io/baseline-resources: '{"order-service": {"requests": {"cpu": "100m", "memory": "96Mi"}, "limits": {"cpu": "500m", "memory": "256Mi"}}}'
spec:
  # replicas intentionally omitted: owned by the HorizontalPodAutoscaler below
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: order-service
          image: novasurge/order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
              name: http
          env:
            - {name: DB_HOST, value: postgres-service}
            - {name: DB_NAME, value: ordersdb}
            - {name: DB_USER, value: novasurge}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: shopfusion-db, key: password}}
            - {name: REDIS_HOST, value: redis-service}
            - {name: PRODUCT_SERVICE_URL, value: "http://product-service:8001"}
            - {name: PAYMENT_SERVICE_URL, value: "http://payment-service:8003"}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopfusion
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: shopfusion
  annotations:
    novasurge.io/baseline: '{"minReplicas": 2, "maxReplicas": 4}'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # ignore start-up CPU bursts
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
