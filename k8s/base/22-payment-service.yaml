# payment-service — simulated card processor, publishes payment events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: shopfusion
  labels:
    app: payment-service
    tier: backend
  annotations:
    novasurge.io/baseline-resources: '{"payment-service": {"requests": {"cpu": "100m", "memory": "96Mi"}, "limits": {"cpu": "500m", "memory": "256Mi"}}}'
spec:
  # replicas intentionally omitted: owned by the HorizontalPodAutoscaler below
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: payment-service
          image: novasurge/payment-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
              name: http
          env:
            - {name: DB_HOST, value: postgres-service}
            - {name: DB_NAME, value: paymentsdb}
            - {name: DB_USER, value: novasurge}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: shopfusion-db, key: password}}
            - {name: REDIS_HOST, value: redis-service}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: shopfusion
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8003
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: shopfusion
  annotations:
    novasurge.io/baseline: '{"minReplicas": 2, "maxReplicas": 4}'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # ignore start-up CPU bursts
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
