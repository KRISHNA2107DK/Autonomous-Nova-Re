# nginx-gateway — public entry point (NodePort 30080 -> host 127.0.0.1:30080).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: shopfusion
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 2048;
    }

    http {
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;

      upstream api_gateway {
        server api-gateway.shopfusion.svc.cluster.local:3000;
        keepalive 32;
        # Services balance per connection: recycle so traffic keeps spreading
        # across gateway replicas instead of pinning to the first ones reached.
        keepalive_requests 50;
      }

      server {
        listen 80;

        location = /nginx-health {
          default_type application/json;
          return 200 '{"status":"ok","service":"nginx-gateway"}';
        }

        location / {
          proxy_pass            http://api_gateway;
          proxy_http_version    1.1;
          proxy_set_header      Connection "";
          proxy_set_header      Host $host;
          proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_connect_timeout 2s;
          proxy_send_timeout    10s;
          proxy_read_timeout    10s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: shopfusion
  labels:
    app: nginx-gateway
    tier: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
        tier: ingress
      annotations:
        checksum/config: v3
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /nginx-health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: shopfusion
  labels:
    app: nginx-gateway
spec:
  type: NodePort
  selector:
    app: nginx-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
