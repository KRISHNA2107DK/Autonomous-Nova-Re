# api-gateway — routes /products /orders /payments /notifications to their services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopfusion
  labels:
    app: api-gateway
    tier: edge
  annotations:
    novasurge.io/baseline-resources: '{"api-gateway": {"requests": {"cpu": "100m", "memory": "64Mi"}, "limits": {"cpu": "500m", "memory": "192Mi"}}}'
spec:
  # replicas intentionally omitted: owned by the HorizontalPodAutoscaler below
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: api-gateway
          image: novasurge/api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - {name: PRODUCT_SERVICE_URL, value: "http://product-service:8001"}
            - {name: ORDER_SERVICE_URL, value: "http://order-service:8002"}
            - {name: PAYMENT_SERVICE_URL, value: "http://payment-service:8003"}
            - {name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:3001"}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopfusion
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: shopfusion
  annotations:
    novasurge.io/baseline: '{"minReplicas": 2, "maxReplicas": 4}'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # ignore start-up CPU bursts
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
