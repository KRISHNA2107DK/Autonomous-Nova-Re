# notification-service — consumes order/payment events from Redis pub/sub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shopfusion
  labels:
    app: notification-service
    tier: backend
  annotations:
    novasurge.io/baseline-resources: '{"notification-service": {"requests": {"cpu": "25m", "memory": "64Mi"}, "limits": {"cpu": "250m", "memory": "192Mi"}}}'
spec:
  # replicas intentionally omitted: owned by the HorizontalPodAutoscaler below
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: notification-service
          image: novasurge/notification-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              name: http
          env:
            - {name: REDIS_HOST, value: redis-service}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shopfusion
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: shopfusion
  annotations:
    novasurge.io/baseline: '{"minReplicas": 1, "maxReplicas": 3}'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # ignore start-up CPU bursts
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
