[project]
name = "novasurge"
version = "2.0.0"
description = "Autonomous chaos engineering and self-healing platform for Kubernetes microservices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
